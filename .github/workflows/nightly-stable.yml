# Why this is a separate workflow, and scheduled rather than per-push.
#
# `Zenzic VS Code CI` runs the extension-host suite against the
# `engines.vscode` floor. That is the right default: the floor is the oldest
# host we claim to support, so it is where a regression hides, and it cannot
# be moved by anyone outside this project.
#
# The floor is not what users run. A break introduced by a new VS Code release
# would reach them before anything here noticed. This job closes that gap by
# running the same suite against the `stable` channel.
#
# It is deliberately NOT part of the PR gate. `stable` is a moving target we
# do not control: on every push, an upstream release that breaks something
# would put a red X on the pull request of someone who did nothing wrong, and
# a red X that means "not your fault" is learned as noise -- the exact way a
# gate stops being read. Nightly keeps the two signals apart: "upstream broke
# us" belongs to the maintainer in the morning, "your change broke something"
# belongs to the PR author now.
#
# Living in its own file means a pull request cannot trigger it at all, which
# is a stronger guarantee than a job-level `if:` on the same workflow.

name: Zenzic VS Code Nightly (stable channel)

on:
  schedule:
    # 03:17 UTC -- off the hour, where scheduled-run contention is lower.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-suite-stable:
    name: Extension-host suite (VS Code stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The nightly deliberately does NOT read .zenzic-core-ref: it answers
      # "does the shipped combination still work on today's VS Code", and the
      # shipped engine is the one on main.
      - name: Checkout Zenzic Core (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: PythonWoods-Dev/zenzic
          ref: main
          path: _zenzic_core
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Zenzic Core venv for the extension-host suite
        env:
          ZENZIC_CORE_PATH: _zenzic_core
        run: uv sync --project _zenzic_core

      - name: Extension-host suite (VS Code stable, xvfb)
        env:
          ZENZIC_HOST_TEST_EXECUTABLE: ${{ github.workspace }}/_zenzic_core/.venv/bin/zenzic
          VSCODE_TEST_VERSION: stable
        run: xvfb-run -a npm run test:host
