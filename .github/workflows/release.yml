name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Required to create the GitHub Release

jobs:
  release:
    name: Build and Publish VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # C1 fix: aligned with ci.yml — was checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Nothing else rejects an unsigned tag: no repository in this ecosystem has a
      # ruleset targeting `refs/tags/*`, so a lightweight `git tag v1.2.3` carries
      # no signature, is accepted by the platform, and still triggers this
      # workflow. This is the only place the tag's form can be enforced, and it
      # runs before the VSIX is built so a bad tag publishes nothing.
      #
      # Three assertions, each failing differently: annotated (a lightweight tag
      # resolves to type `commit`), carries a signature block, and is verified by
      # GitHub against a registered key -- the last catching a signature made with
      # a key nobody trusts, which looks identical to a good one locally.
      - name: Verify the release tag is annotated and signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          kind="$(git cat-file -t "refs/tags/${tag}")"
          if [ "${kind}" != "tag" ]; then
            echo "::error::${tag} is a lightweight tag (object type '${kind}'), not an annotated signed tag. Recreate it with 'just release-tag'."
            exit 1
          fi
          if ! git cat-file tag "refs/tags/${tag}" | grep -qE 'BEGIN (SSH|PGP) SIGNATURE'; then
            echo "::error::${tag} carries no signature. Recreate it with 'just release-tag'."
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/${tag}")"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')"
          reason="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.reason')"
          if [ "${verified}" != "true" ]; then
            echo "::error::${tag}'s signature is not verified by GitHub (reason: ${reason})."
            exit 1
          fi
          echo "${tag}: annotated, signed, verified (${reason})."

      - name: Setup Node.js
        # C1 fix: aligned with ci.yml — was setup-node@v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Package VSIX
        # C2 fix: removed redundant `npm run build` — vsce already runs
        # vscode:prepublish (which calls `npm run build -- --production`) internally.
        run: npx @vscode/vsce package

      - name: Create GitHub Release
        # C3: pinned to immutable SHA-256 (v3.0.3)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: "*.vsix"
          generate_release_notes: true
          draft: false
