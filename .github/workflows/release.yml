name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Required to create the GitHub Release

jobs:
  release:
    name: Build and Publish VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # C1 fix: aligned with ci.yml — was checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        # C1 fix: aligned with ci.yml — was setup-node@v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Package VSIX
        # C2 fix: removed redundant `npm run build` — vsce already runs
        # vscode:prepublish (which calls `npm run build -- --production`) internally.
        run: npx @vscode/vsce package

      - name: Create GitHub Release
        # C3: pinned to immutable SHA-256 (v3.0.3)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: "*.vsix"
          generate_release_notes: true
          draft: false
