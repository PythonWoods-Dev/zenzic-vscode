# CONTRIBUTING.md in this repository requires a `Signed-off-by:` trailer on every
# commit, and until 2026-09-12 nothing checked it. A standing rule with no
# mechanical check is one the environment can override: the sibling repositories
# all enforced this, and an ecosystem-wide sweep found this one documenting the
# requirement and enforcing nothing.
#
# Deliberately identical in shape to the core's compliance workflow rather than a
# fresh implementation, so the two cannot drift in what they consider a valid
# sign-off.

name: Zenzic VS Code Compliance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: Check DCO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Checking commits between $BASE_SHA and $HEAD_SHA"

          git log --no-merges --format='%H' "$BASE_SHA..$HEAD_SHA" | while read -r commit_sha; do
            commit_msg=$(git log -1 --format='%B' "$commit_sha")
            if ! echo "$commit_msg" | grep -q "^Signed-off-by:"; then
              echo "::error::Commit $commit_sha is missing 'Signed-off-by:' sign-off."
              exit 1
            fi
          done
