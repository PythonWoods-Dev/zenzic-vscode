[tool.bumpversion]
current_version = "0.30.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
commit_args = "-s"
message = "chore(release): bump version to {new_version}"
tag = false

[[tool.bumpversion.files]]
filename = "package.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = "\"name\": \"zenzic-vscode\",\n  \"version\": \"{current_version}\""
replace = "\"name\": \"zenzic-vscode\",\n  \"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = "\"name\": \"zenzic-vscode\",\n      \"version\": \"{current_version}\""
replace = "\"name\": \"zenzic-vscode\",\n      \"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = '## \[Unreleased\](\s*\n\*Upcoming changes for the next release\.\*)?'
replace = '''## [Unreleased]

*Upcoming changes for the next release.*

## [{new_version}] - {now:%Y-%m-%d}'''
regex = true

[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = "| **Extension Version** | {current_version} |"
replace = "| **Extension Version** | {new_version} |"

[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = 'git tag -s -m "Release v{current_version}" v{current_version}'
replace = 'git tag -s -m "Release v{new_version}" v{new_version}'


[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = "git push origin v{current_version}"
replace = "git push origin v{new_version}"

[[tool.bumpversion.files]]
filename = ".github/ISSUE_TEMPLATE/bug_report.yml"
search = 'placeholder: "{current_version}"'
replace = 'placeholder: "{new_version}"'

[[tool.bumpversion.files]]
# The supported-version table on the security page. Registered 2026-09-08 after
# an audit found it unregistered here and in zenzic (zenzic-action already had
# it): at a tag this would have gone on claiming 0.30.x was current and the new
# release unsupported, on the one page a user reads when deciding whether to
# upgrade after a vulnerability (ADR-092).
# The table writes `0.30.x` in one row and `< 0.30.0` in the next, so the two
# rows need different placeholders: components for the first, the full version
# for the second. {current_version} alone would match only half the table.
filename = "SECURITY.md"
search = '''| `{current_major}.{current_minor}.x` (current) | ✅ All security fixes |
| `< {current_version}` | ❌ End of life — no support |'''
replace = '''| `{new_major}.{new_minor}.x` (current) | ✅ All security fixes |
| `< {new_version}` | ❌ End of life — no support |'''
